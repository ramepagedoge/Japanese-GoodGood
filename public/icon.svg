<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- Japanese sun circle with subtle glow -->
  <circle cx="256" cy="256" r="170" fill="#ffffff" opacity="0.15" />
  <!-- Hiragana "あ" stylized -->
  <text x="256" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="240" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">あ</text>
  <!-- Modern sparkle accent -->
  <path d="M390 100 L400 130 L430 140 L400 150 L390 180 L380 150 L350 140 L380 130 Z" fill="#fde047" />
</svg>
